<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProposalMatch - Procurement Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.6;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 20px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 4px;
    }
    .match { color: #00e676; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #00e676;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .upload-zone {
      border: 2px dashed #00e676;
      border-radius: 8px;
      padding: 60px;
      text-align: center;
      margin-bottom: 40px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-zone:hover { background: rgba(0, 230, 118, 0.05); }
    .upload-zone.dragover { background: rgba(0, 230, 118, 0.1); border-color: #00e676; }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .upload-zone h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .upload-zone p {
      color: #888;
      font-size: 14px;
    }
    .file-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      min-height: 40px;
    }
    .file-pill {
      background: #00e676;
      color: #0a0a0a;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    button {
      background: #00e676;
      color: #0a0a0a;
      border: none;
      padding: 12px 32px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Bebas Neue', sans-serif;
    }
    button:hover { background: #00c853; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .loading { display: none; text-align: center; margin: 40px 0; }
    .loading.active { display: block; }
    .loader {
      width: 100%;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .loader-bar {
      height: 100%;
      background: #00e676;
      animation: load 1.5s infinite;
    }
    @keyframes load {
      0% { width: 0; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
    .results { margin-top: 40px; }
    .score-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 20px;
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .score-card h3 {
      font-size: 20px;
      margin-bottom: 15px;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
    }
    .rank-badge {
      display: inline-block;
      background: #00e676;
      color: #0a0a0a;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .rank-badge.disqualified {
      background: #ff4444;
      color: white;
    }
    .score-value {
      font-size: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      margin: 20px 0;
      color: #00e676;
    }
    .score-value.disqualified { color: #ff4444; }
    .bar {
      background: #2a2a2a;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #00e676;
      width: 0%;
      animation: fillBar 0.8s ease;
    }
    @keyframes fillBar {
      from { width: 0%; }
      to { width: var(--width); }
    }
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 40px;
      border: 1px solid #2a2a2a;
    }
    .comparison-table th {
      background: #1a1a1a;
      padding: 15px;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid #2a2a2a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    .comparison-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #2a2a2a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
    }
    .comparison-table td:hover { background: #1a1a1a; }
    .comparison-table td.best { background: rgba(0, 230, 118, 0.1); }
    .comparison-table td.worst { background: rgba(255, 68, 68, 0.1); }
    .criteria-panel {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 8px;
      margin-top: 40px;
      border: 1px solid #2a2a2a;
    }
    .slider-group {
      margin-bottom: 20px;
    }
    .slider-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #00e676;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #00e676;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .weight-display {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #2a2a2a;
    }
    .weight-item {
      text-align: center;
    }
    .weight-item span { display: block; font-size: 18px; font-weight: 600; color: #00e676; }
    .weight-item p { font-size: 12px; color: #888; }
    .collaboration-panel {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 8px;
      margin-top: 40px;
      border: 1px solid #2a2a2a;
    }
    .comment-box {
      background: #0a0a0a;
      padding: 15px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      border-radius: 4px;
      margin-bottom: 10px;
      font-family: 'DM Sans', sans-serif;
    }
    .export-btn { background: #00e676; }
    .approve-btn { background: #4caf50; }
    .reject-btn { background: #f44336; }
