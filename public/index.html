<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProposalMatch - Procurement Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.6;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 20px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 4px;
    }
    .match { color: #00e676; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #00e676;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .upload-zone {
      border: 2px dashed #00e676;
      border-radius: 8px;
      padding: 60px;
      text-align: center;
      margin-bottom: 40px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-zone:hover { background: rgba(0, 230, 118, 0.05); }
    .upload-zone.dragover { background: rgba(0, 230, 118, 0.1); border-color: #00e676; }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .upload-zone h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .upload-zone p {
      color: #888;
      font-size: 14px;
    }
    .file-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      min-height: 40px;
    }
    .file-pill {
      background: #00e676;
      color: #0a0a0a;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    button {
      background: #00e676;
      color: #0a0a0a;
      border: none;
      padding: 12px 32px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Bebas Neue', sans-serif;
    }
    button:hover { background: #00c853; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .loading { display: none; text-align: center; margin: 40px 0; }
    .loading.active { display: block; }
    .loader {
      width: 100%;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .loader-bar {
      height: 100%;
      background: #00e676;
      animation: load 1.5s infinite;
    }
    @keyframes load {
      0% { width: 0; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
    .results { margin-top: 40px; }
    .score-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 20px;
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .score-card h3 {
      font-size: 20px;
      margin-bottom: 15px;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
    }
    .rank-badge {
      display: inline-block;
      background: #00e676;
      color: #0a0a0a;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .rank-badge.disqualified {
      background: #ff4444;
      color: white;
    }
    .score-value {
      font-size: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      margin: 20px 0;
      color: #00e676;
    }
    .score-value.disqualified { color: #ff4444; }
    .bar {
      background: #2a2a2a;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #00e676;
      width: 0%;
      animation: fillBar 0.8s ease;
    }
    @keyframes fillBar {
      from { width: 0%; }
      to { width: var(--width); }
    }
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 40px;
      border: 1px solid #2a2a2a;
    }
    .comparison-table th {
      background: #1a1a1a;
      padding: 15px;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid #2a2a2a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    .comparison-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #2a2a2a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
    }
    .comparison-table td:hover { background: #1a1a1a; }
    .comparison-table td.best { background: rgba(0, 230, 118, 0.1); }
    .comparison-table td.worst { background: rgba(255, 68, 68, 0.1); }
    .criteria-panel {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 8px;
      margin-top: 40px;
      border: 1px solid #2a2a2a;
    }
    .slider-group {
      margin-bottom: 20px;
    }
    .slider-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #00e676;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #00e676;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .weight-display {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #2a2a2a;
    }
    .weight-item {
      text-align: center;
    }
    .weight-item span { display: block; font-size: 18px; font-weight: 600; color: #00e676; }
    .weight-item p { font-size: 12px; color: #888; }
    .collaboration-panel {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 8px;
      margin-top: 40px;
      border: 1px solid #2a2a2a;
    }
    .comment-box {
      background: #0a0a0a;
      padding: 15px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      border-radius: 4px;
      margin-bottom: 10px;
      font-family: 'DM Sans', sans-serif;
    }
    .export-btn { background: #00e676; }
    .approve-btn { background: #4caf50; }
    .reject-btn { background: #f44336; }
    .approve-btn:hover { background: #45a049; }
    .reject-btn:hover { background: #da190b; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PROPOSAL<span class="match">MATCH</span><br><small style="font-size: 12px; letter-spacing: 3px; color: #666;">PROCUREMENT INTELLIGENCE</small></h1>
      <div class="status">
        <span class="status-dot"></span> SISTEMA ACTIVO
      </div>
    </header>

    <section style="margin-bottom: 40px;">
      <h2 style="font-family: 'Bebas Neue'; font-size: 14px; letter-spacing: 2px; margin-bottom: 20px; color: #888;">01 – CARGA TUS PROPUESTAS</h2>
      
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">⬆️</div>
        <h2>ARRASTRA LOS PDF AQUÍ</h2>
        <p>o haz clic para seleccionar archivos</p>
        <p style="font-size: 11px; margin-top: 10px; color: #666;">PDF • Máximo 10 archivos • Texto digital</p>
      </div>

      <div class="file-list" id="fileList"></div>
      <button onclick="analyzeProposals()" id="analyzeBtn" disabled>ANALIZAR PROPUESTAS</button>
    </section>

    <div class="loading" id="loading">
      <div class="loader"><div class="loader-bar"></div></div>
      <p style="color: #888;">Procesando propuestas...</p>
    </div>

    <div class="results" id="results"></div>

    <div class="comparison-table" id="comparisonTable" style="display: none; margin-top: 40px;">
      <table id="table"></table>
    </div>

    <div class="criteria-panel" id="criteriaPanel" style="display: none;">
      <h3 style="font-family: 'Bebas Neue'; letter-spacing: 2px; margin-bottom: 20px;">AJUSTAR CRITERIOS</h3>
      <div id="criteriaSliders"></div>
      <div class="weight-display" id="weightDisplay"></div>
    </div>

    <div class="collaboration-panel" id="collaborationPanel" style="display: none;">
      <h3 style="font-family: 'Bebas Neue'; letter-spacing: 2px; margin-bottom: 20px;">COLABORACIÓN</h3>
      <input type="text" id="stakeholderName" placeholder="Tu nombre (stakeholder)">
      <div id="collaborationContent"></div>
    </div>

    <button onclick="exportReport()" id="exportBtn" class="export-btn" style="display: none; margin-top: 40px;">DESCARGAR REPORTE</button>
    <button onclick="resetApp()" style="display: none; margin-top: 20px; background: #666;">NUEVA EVALUACIÓN</button>
  </div>

  <script>
    let selectedFiles = [];
    let proposals = [];
    const criteria = {
      precioUnitario: 50,
      plazoEntrega: 20,
      volumenMinimo: 10,
      terminosPago: 10,
      certificaciones: 5,
      confiabilidad: 5
    };

    const uploadZone = document.getElementById('uploadZone');
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      selectedFiles = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
      updateFileList();
    });
    uploadZone.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.accept = '.pdf';
      input.onchange = e => {
        selectedFiles = Array.from(e.target.files);
        updateFileList();
      };
      input.click();
    });

    function updateFileList() {
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = selectedFiles.map(f => `<div class="file-pill">${f.name}</div>`).join('');
      document.getElementById('analyzeBtn').disabled = selectedFiles.length === 0;
    }

    async function analyzeProposals() {
      if (selectedFiles.length === 0) return;
      document.getElementById('loading').classList.add('active');
      
      const formData = new FormData();
      selectedFiles.forEach(f => formData.append('pdfs', f));

      try {
        const response = await fetch('/api/analyze', { method: 'POST', body: formData });
        const data = await response.json();
        proposals = data.proposals || [];
        displayResults();
      } catch (e) {
        alert('Error: ' + e.message);
      } finally {
        document.getElementById('loading').classList.remove('active');
      }
    }

    function displayResults() {
      const results = document.getElementById('results');
      results.innerHTML = proposals.map((p, i) => {
        const score = calculateScore(p);
        return `
          <div class="score-card">
            <h3>${p.proveedor}</h3>
            <span class="rank-badge">#${i + 1}</span>
            <div class="score-value" style="--width: ${score}%">${score.toFixed(0)}</div>
            <div class="bar"><div class="bar-fill" style="--width: ${score}%"></div></div>
          </div>
        `;
      }).join('');
      document.getElementById('criteriaPanel').style.display = 'block';
      document.getElementById('collaborationPanel').style.display = 'block';
      document.getElementById('comparisonTable').style.display = 'block';
      document.getElementById('exportBtn').style.display = 'block';
      displayTable();
      displayCollaboration();
    }

    function calculateScore(proposal) {
      let score = 0;
      if (proposal.precioUnitario) score += (1 - Math.min(proposal.precioUnitario / 10000, 1)) * criteria.precioUnitario;
      if (proposal.plazoEntrega) score += (1 - Math.min(proposal.plazoEntrega / 60, 1)) * criteria.plazoEntrega;
      if (proposal.volumenMinimo) score += (1 - Math.min(proposal.volumenMinimo / 50000, 1)) * criteria.volumenMinimo;
      if (proposal.terminosPago) score += 5;
      if (proposal.certificaciones !== 'Sin especificar') score += criteria.certificaciones;
      score += criteria.confiabilidad;
      return Math.min(score, 100);
    }

    function displayTable() {
      const table = document.getElementById('table');
      const headers = ['Proveedor', 'Precio', 'Plazo', 'Vol. Mín', 'Términos', 'Certificaciones', 'Confiabilidad'];
      table.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
      proposals.forEach(p => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${p.proveedor}</td>
          <td>$${p.precioUnitario || 'N/A'}</td>
          <td>${p.plazoEntrega || 'N/A'} días</td>
          <td>${p.volumenMinimo || 'N/A'}</td>
          <td>${p.terminosPago}</td>
          <td>${p.certificaciones}</td>
          <td><input type="number" value="${p.confiabilidad}" min="0" max="10"></td>
        `;
        table.appendChild(row);
      });
    }

    function displayCollaboration() {
      const content = document.getElementById('collaborationContent');
      content.innerHTML = proposals.map(p => `
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #2a2a2a;">
          <h4>${p.proveedor}</h4>
          <input type="text" placeholder="Agregar comentario..." style="width: 100%; margin-top: 10px;">
          <div style="margin-top: 10px; gap: 10px; display: flex;">
            <button class="approve-btn" onclick="alert('Aprobado: ${p.proveedor}')">APROBAR</button>
            <button class="reject-btn" onclick="alert('Rechazado: ${p.proveedor}')">RECHAZAR</button>
          </div>
        </div>
      `).join('');
    }

    function exportReport() {
      let report = 'PROPOSALMATCH - REPORTE DE ANÁLISIS\n\n';
      proposals.forEach((p, i) => {
        report += `${i + 1}. ${p.proveedor}\n`;
        report += `   Precio: $${p.precioUnitario || 'N/A'}\n`;
        report += `   Plazo: ${p.plazoEntrega || 'N/A'} días\n`;
        report += `   Vol. Mín: ${p.volumenMinimo || 'N/A'}\n`;
        report += `   Certificaciones: ${p.certificaciones}\n\n`;
      });
      const blob = new Blob([report], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'proposalmatch-report.txt';
      a.click();
    }

    function resetApp() {
      selectedFiles = [];
      proposals = [];
      document.getElementById('fileList').innerHTML = '';
      document.getElementById('results').innerHTML = '';
      document.getElementById('analyzeBtn').disabled = true;
      document.getElementById('criteriaPanel').style.display = 'none';
      document.getElementById('collaborationPanel').style.display = 'none';
      document.getElementById('comparisonTable').style.display = 'none';
      document.getElementById('exportBtn').style.display = 'none';
    }
  </script>
</body>
</html>
